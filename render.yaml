# Render Blueprint — Yomu Game Night
# https://render.com/docs/blueprint-spec
#
# Push this file to your GitHub repo and on Render: "New +" → "Blueprint" →
# select the repo. Render reads this file and provisions everything.

services:
  - type: web
    name: yomu-game-night
    runtime: node
    plan: free                   # 750 free hrs/mo; sleeps after 15 min idle
    region: frankfurt            # change to oregon / singapore / virginia if closer
    branch: main
    autoDeploy: true
    # --include=dev forces devDependencies (TypeScript, Tailwind, PostCSS,
    # @types/*) to install even though Render sets NODE_ENV=production —
    # they're required by `next build`.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    # Must be an unauthenticated path — / now returns 401 (Basic Auth), which
    # would make the health check fail and the deploy never go live.
    healthCheckPath: /healthz
    envVars:
      # Render injects PORT and NODE_ENV=production automatically; no need to set them.
      - key: NODE_OPTIONS
        value: --enable-source-maps
      # Password gate (HTTP Basic Auth) for the whole site. sync:false means the
      # value is NOT stored in this repo — set it in the Render dashboard under
      # Environment. Any username works; only the password is checked. Leaving it
      # unset disables the gate, so it MUST be set for the public deploy.
      - key: SITE_PASSWORD
        sync: false
