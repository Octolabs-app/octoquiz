name = "octoquiz"
account_id = "48e94010454dbf3fe6f708b37130ef5b"
main = "worker/index.js"
compatibility_date = "2026-06-18"
compatibility_flags = [ "nodejs_compat" ]

routes = [
  { pattern = "octoquiz.octolabs.app/*", zone_name = "octolabs.app" }
]

[assets]
directory = "out"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/realtime/*", "/healthz" ]

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "RoomObject" ]
